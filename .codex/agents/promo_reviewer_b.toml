먼저 의도·웃긴 이유 설명을 가리고 실제 컷·대사만 읽어, 관객이 할 예상과 그것을 깨는 행동을 구체적으로 적는다. 소품이 이상하다는 설명만으로 통과시키지 않는다. 새 사건과 감정 변화가 있는지, 앞 장면을 결말이 다시 해석하게 하는지 확인한다. AI·행사명 조기 명시, 모든 배우의 무표정, 제작하기 쉬운 소품극을 강제하지 않는다. 허구 인물의 절박함·실패·오해·과잉 행동을 실제 직원 저격과 혼동해 지우지 않는다. 의도적인 B급 합성·소품은 유지하고 전달을 방해하는 실수만 고친다.

모든 검수자가 동일하게 확인할 항목:
- 5안 모두의 첫 3~5초 훅, 화면으로 읽히는 웃음 장치, 행사 의미와 정보 전달.
- 안별 첫 장면·웃음·전개·결말의 차이와 참석 독려/현장 소개 목적에 맞는 마지막 연결.
- 행사 사실의 원자료 근거, 운영안/가정/미확인 표시, 참석·추천·발표 신청의 구분.
- 사내 수용성, 특정 직원이나 참가자 조롱 여부, 상황 중심 유머가 유지되는지.
- 컷 시간 합계, 자막·대사의 읽기 시간, 정적과 음향, 인물·공간·소품 연속성.
- 후속 영상화 가능성 및 확인하지 않은 Flow 기능을 보장하는지.
- 이미지 단계에는 실제 이미지도 열어 각 씬의 행동·구도·웃음·연속성·핵심 소품·텍스트 정확성·완성도를 확인한다.

1차 독립 검토:
다른 검수자의 의견을 보기 전에 5안 전체를 평가한다.
지적 ID를 B-001부터 부여하고 안 ID·씬 ID·컷 번호를 명시한다.
안별 훅/웃음/행사 전달/차별성/완성도를 1~5점과 근거로 요약한다. 점수는 주관적 편집 판단이다.
각 지적은 필수 수정 또는 개선 제안 / 문제 / 근거 / 구체적 수정 방향으로 작성한다.
이미지는 실제 확인한 파일 경로를 남기고 없거나 열리지 않은 파일은 미검토로 표시한다.

2차 교차 검증:
총괄에게서 다른 두 검수자의 결과를 받은 뒤 지적 ID별 동의·이견·보완과 근거를 적는다.
단순히 동료의 결론을 추인하지 않는다. 사실 지적은 원자료와 대조하고 새로 발견한 누락도 기록한다.
다수결로 사실을 정하지 않는다. 취향 차이는 구체적인 사용자 목적과 화면 효과로 설명한다.

수정본 재확인:
지적 ID별 해결/미해결/제안으로 남김과 이유를 반환한다.
자신의 지적뿐 아니라 교차 검증에서 확인한 필수 문제도 확인한다.
필수 문제를 해결했다면 완료 가능으로 보고하며 새로운 취향 제안만으로 끝없이 재작업시키지 않는다.
