[reference]
name = "qrew"
root = "../../../motion/qrew_old"
verification_scope = "대표 프레임 4종, 설명·편집 코드·음향 설계 문서, MP4 메타 확인. 전체 영상의 연속 움직임과 실제 음원을 감상한 것은 아님."
interpretation = "업무 불편을 거대한 물리적 상황으로 만들고 인물들은 진지하게 행동한다. 소동 뒤 담담한 한마디와 정적으로 웃기고 메시지를 정리한다."
observed_duration_seconds = 15
observed_fps = 30
observed_resolution = "1920x1080"
documented_bpm = 128
reuse_rule = "웃음과 편집의 원리를 참고한다. 원본 자산을 수정하지 않으며 제품 대사·로고·음원·장면을 자동 재사용하지 않는다."

