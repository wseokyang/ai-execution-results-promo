# 경로는 모두 이 프로젝트 폴더(AGENTS.md가 있는 폴더)를 기준으로 한다.
# 초기 조사 기록이다. 후속 기획 실행 시 사용자 최신 지시와 원자료로 갱신한다.
team_name = "AI 실행 결과 발표대회 홍보영상팀"
prepared_on = "2026-10-14"
project_root_relative_to_this_file = ".."
setup_scope = "2026-10-14 사용자 실제 기획 요청 시작: 팀 확인 후 5안 기획·교차검수·씬 대표 이미지 제작. Flow 영상 제작 제외."

[task]
requested_future_deliverable = "차별화된 홍보영상 콘셉트 5안, 각 안의 컷별 스토리보드, 모든 씬의 실제 대표 이미지"
purposes = ["참석 독려", "행사 소개·현장 도입"]
tone = "2026-10-15 사용자 수정: 태국 광고·황당한 고퀄리티 스토리와 의도적인 초저예산 B급을 모두 포함. 소품만 이상한 순한 기업홍보 톤을 벗어나 상황 확대·과장된 연기·급반전·몸개그·반복을 사용."
revision_mix = "고퀄리티 황당 스토리 3안 + 의도적 B급 2안. 상황 폭주형, 감정 과잉·반전형, 몸개그·반복형 각각 포함."
reveal_policy = "AI·행사명을 초반에 반드시 설명하지 않는다. 마지막 반전과 자연스럽게 연결하며 전체 60초 이내."
production_scope = "후속 영상 기획 요청 시 스토리보드와 씬별 이미지까지 추가 요청 없이 자동 진행. Flow 영상 제작·음원 생성·영상 렌더링·업로드는 제외."
automatic_keyframes = true
keyframe_scope = "검수 완료한 5안 모두의 씬별 최소 1장. 사용자 최신 지시로 범위를 좁힌 경우에는 그 범위를 따름."
reviewers = ["promo_reviewer_a", "promo_reviewer_b", "promo_reviewer_c"]
review_method = "3명 모두 동일 종합 기준으로 독립 검토 → 동료 의견 상호 교차 검증 → 수정본 재확인. 이미지에도 적용."

